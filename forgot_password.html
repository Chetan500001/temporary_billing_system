<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Recovery | BILLMate</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #2565AE;
            --primary-light: rgba(37, 101, 174, 0.1);
            --primary-dark: #1A4B8C;
            --secondary: #4A90E2;
            --accent: #2ED573;
            --danger: #FF4757;
            --light: #F8F9FF;
            --dark: #2F3542;
            --gray: #747D8C;
            --light-gray: #F1F2F6;
            --border-radius: 8px;
            --box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--light-gray), white);
            color: var(--dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            width: 100%;
            max-width: 450px;
            position: relative;
            overflow: hidden;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }
        
        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: var(--primary-dark);
            font-size: 1.8rem;
        }
        
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }
        
        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--light-gray);
            border-radius: var(--border-radius);
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            transition: var(--transition);
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 101, 174, 0.1);
        }
        
        .btn {
            background: var(--primary);
            color: white;
            padding: 14px;
            border: none;
            border-radius: var(--border-radius);
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: var(--transition);
            margin-top: 10px;
        }
        
        .btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(37, 101, 174, 0.25);
        }
        
        .btn:disabled {
            background: var(--gray);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .back-to-login {
            text-align: center;
            margin-top: 20px;
        }
        
        .back-to-login a {
            color: var(--primary);
            text-decoration: none;
            transition: var(--transition);
        }
        
        .back-to-login a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }
        
        .step {
            display: none;
        }
        
        .step.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .progress-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            position: relative;
        }
        
        .progress-bar::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--light-gray);
            z-index: 1;
            transform: translateY(-50%);
        }
        
        .progress-step {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--light-gray);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--gray);
            font-weight: 500;
            position: relative;
            z-index: 2;
        }
        
        .progress-step.active {
            background: var(--primary);
            color: white;
        }
        
        .progress-step.completed {
            background: var(--accent);
            color: white;
        }
        
        .error-message {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
        }
        
        .security-question {
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--dark);
        }
        
        .password-requirements {
            font-size: 0.8rem;
            color: var(--gray);
            margin-top: 5px;
        }
        
        .password-container {
            position: relative;
        }
        
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--gray);
            transition: var(--transition);
            background: none;
            border: none;
            padding: 0;
            font-size: 1rem;
            z-index: 2;
        }
        
        .password-toggle:hover {
            color: var(--primary);
        }
        
        .form-group input[type="password"],
        .form-group input[type="text"] {
            padding-right: 35px;
        }
        
        @media (max-width: 576px) {
            .container {
                padding: 30px 20px;
            }
            
            h2 {
                font-size: 1.5rem;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Password Recovery</h2>
        
        <div class="progress-bar">
            <div class="progress-step active" id="step1-indicator">1</div>
            <div class="progress-step" id="step2-indicator">2</div>
            <div class="progress-step" id="step3-indicator">3</div>
        </div>
        
        <!-- Step 1: Email Verification -->
        <div class="step active" id="step1">
            <form id="email-verification-form">
                <input type="hidden" name="step" value="1">
                <div class="form-group">
                    <select name="user_type" required>
                        <option value="" disabled selected>Select Account Type</option>
                        <option value="customer">Customer Account</option>
                        <option value="business">Business Account</option>
                    </select>
                </div>
                <div class="form-group">
                    <input type="email" name="email" placeholder="Enter your email address" required>
                    <div class="error-message" id="email-error"></div>
                </div>
                <button type="submit" class="btn" id="step1-btn">Continue</button>
            </form>
            <div class="back-to-login">
                <a href="businesslogin.html">Back to Login</a>
            </div>
        </div>
        
        <!-- Step 2: Security Questions -->
        <div class="step" id="step2">
            <form id="security-questions-form">
                <input type="hidden" name="step" value="2">
                <input type="hidden" name="user_type" id="step2-user-type">
                <input type="hidden" name="email" id="step2-email">
                <div class="form-group">
                    <div class="security-question" id="security-question1-text"></div>
                    <input type="text" name="security_answer1" placeholder="Your answer" required>
                    <div class="error-message" id="answer1-error"></div>
                </div>
                <div class="form-group">
                    <div class="security-question" id="security-question2-text"></div>
                    <input type="text" name="security_answer2" placeholder="Your answer" required>
                    <div class="error-message" id="answer2-error"></div>
                </div>
                <button type="submit" class="btn" id="step2-btn">Verify Answers</button>
            </form>
            <div class="back-to-login">
                <a href="businesslogin.html">Back to Login</a>
            </div>
        </div>
        
        <!-- Step 3: Reset Password -->
        <div class="step" id="step3">
            <form id="reset-password-form">
                <input type="hidden" name="step" value="3">
                <input type="hidden" name="user_type" id="step3-user-type">
                <input type="hidden" name="email" id="step3-email">
                <div class="form-group">
                    <input type="password" name="new_password" id="new-password" placeholder="New Password" required>
                    <i class="fas fa-eye password-toggle" onclick="togglePassword('new-password', this)"></i>
                    <div class="password-requirements">
                        Password must be at least 8 characters with uppercase, lowercase, and numbers
                    </div>
                    <div class="error-message" id="password-error"></div>
                </div>
                <div class="form-group">
                    <input type="password" name="confirm_password" id="confirm-password" placeholder="Confirm New Password" required>
                    <i class="fas fa-eye password-toggle" onclick="togglePassword('confirm-password', this)"></i>
                    <div class="error-message" id="confirm-error"></div>
                </div>
                <button type="submit" class="btn" id="step3-btn">Reset Password</button>
            </form>
            <div class="back-to-login">
                <a href="businesslogin.html">Back to Login</a>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            // Current step tracking
            let currentStep = 1;
            
            // Show error message
            function showError(elementId, message) {
                $(elementId).text(message).show();
                setTimeout(() => {
                    $(elementId).hide();
                }, 5000);
            }
            
            // Handle form submission for step 1
            $('#email-verification-form').submit(function(e) {
                e.preventDefault();
                $('#step1-btn').prop('disabled', true).text('Verifying...');
                $('#email-error').hide();
                
                $.ajax({
                    type: 'POST',
                    url: 'password_recovery.php',
                    data: $(this).serialize(),
                    dataType: 'json',
                    success: function(response) {
                        if (response.success) {
                            // Update step 2 with the security questions
                            $('#security-question1-text').text('1. ' + response.question1);
                            $('#security-question2-text').text('2. ' + response.question2);
                            $('#step2-user-type').val($('select[name="user_type"]').val());
                            $('#step2-email').val($('input[name="email"]').val());
                            
                            // Update progress bar
                            $('#step1-indicator').removeClass('active').addClass('completed');
                            $('#step2-indicator').addClass('active');
                            
                            // Switch to step 2
                            $('#step1').removeClass('active');
                            $('#step2').addClass('active');
                            currentStep = 2;
                        } else {
                            showError('#email-error', response.message || 'Error: Could not verify email.');
                        }
                    },
                    error: function() {
                        showError('#email-error', 'Error: Could not connect to server.');
                    },
                    complete: function() {
                        $('#step1-btn').prop('disabled', false).text('Continue');
                    }
                });
            });
            
            // Handle form submission for step 2
            $('#security-questions-form').submit(function(e) {
                e.preventDefault();
                $('#step2-btn').prop('disabled', true).text('Verifying...');
                $('#answer1-error').hide();
                $('#answer2-error').hide();
                
                $.ajax({
                    type: 'POST',
                    url: 'password_recovery.php',
                    data: $(this).serialize(),
                    dataType: 'json',
                    success: function(response) {
                        if (response.success) {
                            // Update step 3 with user info
                            $('#step3-user-type').val($('#step2-user-type').val());
                            $('#step3-email').val($('#step2-email').val());
                            
                            // Update progress bar
                            $('#step2-indicator').removeClass('active').addClass('completed');
                            $('#step3-indicator').addClass('active');
                            
                            // Switch to step 3
                            $('#step2').removeClass('active');
                            $('#step3').addClass('active');
                            currentStep = 3;
                        } else {
                            showError('#answer1-error', response.message || 'Security answers do not match.');
                        }
                    },
                    error: function() {
                        showError('#answer1-error', 'Error: Could not connect to server.');
                    },
                    complete: function() {
                        $('#step2-btn').prop('disabled', false).text('Verify Answers');
                    }
                });
            });
            
            // Handle form submission for step 3
            $('#reset-password-form').submit(function(e) {
                e.preventDefault();
                $('#step3-btn').prop('disabled', true).text('Processing...');
                $('#password-error').hide();
                $('#confirm-error').hide();
                
                // Client-side validation
                const newPassword = $('#new-password').val();
                const confirmPassword = $('#confirm-password').val();
                
                if (newPassword !== confirmPassword) {
                    showError('#confirm-error', 'Passwords do not match');
                    $('#step3-btn').prop('disabled', false).text('Reset Password');
                    return;
                }
                
                if (newPassword.length < 8) {
                    showError('#password-error', 'Password must be at least 8 characters');
                    $('#step3-btn').prop('disabled', false).text('Reset Password');
                    return;
                }
                
                $.ajax({
                    type: 'POST',
                    url: 'password_recovery.php',
                    data: $(this).serialize(),
                    dataType: 'json',
                    success: function(response) {
                        if (response.success) {
                            alert('Password reset successfully! You can now login with your new password.');
                            window.location.href = 'businesslogin.html';
                        } else {
                            showError('#password-error', response.message || 'Error: Could not reset password.');
                        }
                    },
                    error: function() {
                        showError('#password-error', 'Error: Could not connect to server.');
                    },
                    complete: function() {
                        $('#step3-btn').prop('disabled', false).text('Reset Password');
                    }
                });
            });
            
            // Input validation for password strength
            $('#new-password').on('input', function() {
                const password = $(this).val();
                if (password.length > 0 && password.length < 8) {
                    $('#password-error').text('Password too short').show();
                } else {
                    $('#password-error').hide();
                }
            });
            
            // Confirm password matching
            $('#confirm-password').on('input', function() {
                if ($(this).val() !== $('#new-password').val()) {
                    $('#confirm-error').text('Passwords do not match').show();
                } else {
                    $('#confirm-error').hide();
                }
            });
        });
    </script>
</body>
</html>
